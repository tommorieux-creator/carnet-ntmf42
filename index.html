<meta name="theme-color" content="#0E0A17" media="(prefers-color-scheme: dark)">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px/1.4 system-ui,-apple-system,sans-serif;background:#FFF1F7}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* Couche autonome : fournit au carnet, dans un navigateur ordinaire, les fonctions qu'il attend
   (db, user, assets, downloads, sample). Données : IndexedDB de l'appareil. IA : API Anthropic avec
   la clé personnelle de l'utilisateur, appelée directement depuis le navigateur. */
(function () {
  "use strict";
  var DB_NAME = "ntmf42-carnet", KEY_LS = "ntmf42-api-key";
  var MODELS = { quick: "claude-haiku-4-5-20251001", "default": "claude-sonnet-5-5", complex: "claude-opus-5-5" };
  var API = "https://api.anthropic.com/v1/messages";
  var web = window.__web = { persistent: false };

  /* ---------------------------------------------------------------- stockage */
  var idb = null, mem = new Map(), blobs = new Map(), urls = new Map();
  var clone = function (o) { return o == null ? o : (typeof structuredClone === "function" ? structuredClone(o) : JSON.parse(JSON.stringify(o))); };
  function openIdb() {
    return new Promise(function (res) {
      try {
        var rq = indexedDB.open(DB_NAME, 1);
        rq.onupgradeneeded = function () { var d = rq.result; ["docs", "blobs"].forEach(function (n) { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
        rq.onsuccess = function () { res(rq.result); };
        rq.onerror = function () { res(null); };
        rq.onblocked = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  var reqP = function (rq) { return new Promise(function (ok, ko) { rq.onsuccess = function () { ok(rq.result); }; rq.onerror = function () { ko(rq.error); }; }); };
  function loadAll(store) {
    var os = idb.transaction(store, "readonly").objectStore(store);
    return Promise.all([reqP(os.getAllKeys()), reqP(os.getAll())]).then(function (r) { return r[0].map(function (k, i) { return [k, r[1][i]]; }); });
  }
  function idbOp(store, fn) {
    if (!idb) return Promise.resolve();
    return new Promise(function (ok, ko) {
      var t;
      try { t = idb.transaction(store, "readwrite"); fn(t.objectStore(store)); } catch (e) { ko(mapStoreErr(e)); return; }
      t.oncomplete = function () { ok(); };
      t.onerror = t.onabort = function () { ko(mapStoreErr(t.error)); };
    });
  }
  function mapStoreErr(e) {
    var q = e && (e.name === "QuotaExceededError" || /quota/i.test(e.message || ""));
    return { code: q ? "quota_exceeded" : "storage_error", message: q ? "Le stockage de l'appareil est plein." : "Enregistrement impossible sur cet appareil." };
  }
  web.ready = openIdb().then(function (d) {
    idb = d;
    if (!idb) return;
    return Promise.all([loadAll("docs"), loadAll("blobs")]).then(function (r) {
      r[0].forEach(function (kv) { mem.set(kv[0], kv[1]); });
      r[1].forEach(function (kv) { var v = kv[1]; if (!v || !v.buf) return; var b = new Blob([v.buf], { type: v.type || "" }); blobs.set(kv[0], { blob: b, type: v.type, size: v.size }); });
      web.persistent = true;
    });
  }).catch(function () { idb = null; });

  /* ---------------------------------------------------------------- base de documents */
  var listeners = [], dirty = new Set(), flushT = 0;
  var parentOf = function (p) { return p.slice(0, p.lastIndexOf("/")); };
  function docSnap(path) {
    var v = mem.get(path);
    return { id: path.split("/").pop(), exists: v !== undefined, data: function () { return clone(v); } };
  }
  function colSnap(path) {
    var pre = path + "/", docs = [];
    mem.forEach(function (v, k) { if (k.indexOf(pre) === 0 && k.slice(pre.length).indexOf("/") < 0) docs.push(docSnap(k)); });
    return { docs: docs, size: docs.length, empty: !docs.length, forEach: function (f) { docs.forEach(f); } };
  }
  function emit(l) { try { l.cb(l.kind === "doc" ? docSnap(l.path) : colSnap(l.path)); } catch (e) { console.error(e); } }
  function touched(path) {
    listeners.forEach(function (l) { if ((l.kind === "doc" && l.path === path) || (l.kind === "col" && l.path === parentOf(path))) dirty.add(l); });
    clearTimeout(flushT); flushT = setTimeout(function () { var ls = Array.from(dirty); dirty.clear(); ls.forEach(function (l) { if (l.on) emit(l); }); }, 0);
  }
  function listen(kind, path, cb) {
    var l = { kind: kind, path: path, cb: cb, on: true }; listeners.push(l);
    web.ready.then(function () { setTimeout(function () { if (l.on) emit(l); }, 0); });
    return function () { l.on = false; listeners = listeners.filter(function (x) { return x !== l; }); };
  }
  function write(path, val) {
    return web.ready.then(function () {
      var before = mem.get(path);
      mem.set(path, val); touched(path);
      return idbOp("docs", function (os) { os.put(val, path); }).catch(function (e) { if (before === undefined) mem.delete(path); else mem.set(path, before); touched(path); throw e; });
    });
  }
  function remove(path) {
    return web.ready.then(function () {
      mem.delete(path); touched(path);
      return idbOp("docs", function (os) { os.delete(path); });
    });
  }
  function checkData(d) { if (!d || typeof d !== "object" || Array.isArray(d)) throw { code: "invalid_argument", message: "Document invalide." }; return clone(d); }
  function docRef(path) {
    return {
      id: path.split("/").pop(), path: path,
      collection: function (n) { return colRef(path + "/" + n); },
      get: function () { return web.ready.then(function () { return docSnap(path); }); },
      set: function (d) { try { return write(path, checkData(d)); } catch (e) { return Promise.reject(e); } },
      update: function (patch) {
        return web.ready.then(function () {
          var cur = mem.get(path); if (cur === undefined) throw { code: "not_found", message: "Document introuvable." };
          var next = clone(cur), p = checkData(patch);
          Object.keys(p).forEach(function (k) {
            var parts = k.split("."), o = next;
            for (var i = 0; i < parts.length - 1; i++) { if (!o[parts[i]] || typeof o[parts[i]] !== "object") o[parts[i]] = {}; o = o[parts[i]]; }
            o[parts[parts.length - 1]] = p[k];
          });
          return write(path, next);
        });
      },
      "delete": function () { return remove(path); },
      onSnapshot: function (cb) { return listen("doc", path, cb); }
    };
  }
  function colRef(path) {
    return {
      id: path.split("/").pop(), path: path,
      doc: function (id) { return docRef(path + "/" + id); },
      get: function () { return web.ready.then(function () { return colSnap(path); }); },
      onSnapshot: function (cb) { return listen("col", path, cb); }
    };
  }
  var db = { doc: docRef, collection: colRef };

  /* ---------------------------------------------------------------- utilisateur local */
  var user = {
    id: function () { return Promise.resolve("local"); },
    me: function () { return Promise.resolve({ id: "local", name: "", guest: false }); },
    profiles: function () { return Promise.resolve({}); },
    isOwner: function () { return true; }, canEdit: function () { return true; }, can: function () { return true; }
  };

  /* ---------------------------------------------------------------- fichiers (photos, GPX) */
  var hex = function () { var a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, function (b) { return b.toString(16).padStart(2, "0"); }).join(""); };
  window.__blobUrl = function (id) {
    if (urls.has(id)) return urls.get(id);
    var b = blobs.get(id); if (!b) return "data:,";
    var u = URL.createObjectURL(b.blob); urls.set(id, u); return u;
  };
  var assets = {
    upload: function (blob, opts) {
      var type = blob.type || (opts && opts.type) || "application/octet-stream", id = hex();
      return blob.arrayBuffer().then(function (buf) {
        return idbOp("blobs", function (os) { os.put({ buf: buf, type: type, size: blob.size }, id); });
      }).then(function () {
        blobs.set(id, { blob: new Blob([blob], { type: type }), type: type, size: blob.size });
        return { id: id, url: window.__blobUrl(id), sizeBytes: blob.size, contentType: type };
      });
    },
    "delete": function (id) {
      if (urls.has(id)) { URL.revokeObjectURL(urls.get(id)); urls.delete(id); }
      blobs.delete(id);
      return idbOp("blobs", function (os) { os.delete(id); });
    },
    list: function () {
      var list = [], bytes = 0;
      blobs.forEach(function (b, id) { list.push({ id: id, url: window.__blobUrl(id), sizeBytes: b.size, contentType: b.type }); bytes += b.size || 0; });
      var est = (navigator.storage && navigator.storage.estimate) ? navigator.storage.estimate().catch(function () { return {}; }) : Promise.resolve({});
      return est.then(function (e) { return { assets: list, usage: { files: list.length, bytes: bytes, maxBytes: (e && e.quota) || 500 * 1048576 } }; });
    }
  };

  /* ---------------------------------------------------------------- téléchargements */
  var downloads = {
    save: function (o) {
      var name = String(o.filename || "export.txt");
      var type = /\.json$/i.test(name) ? "application/json" : /\.csv$/i.test(name) ? "text/csv" : "text/plain";
      var blob = o.data instanceof Blob ? o.data : new Blob([o.data == null ? "" : String(o.data)], { type: type + ";charset=utf-8" });
      var touch = /iPhone|iPad|iPod|Android/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      if (touch && navigator.canShare && typeof File === "function") {
        var file = new File([blob], name, { type: type });
        if (navigator.canShare({ files: [file] })) {
          return navigator.share({ files: [file], title: name }).catch(function (e) {
            if (e && e.name === "AbortError") throw { code: "declined", message: "Annulé." };
            return anchor(blob, name);
          });
        }
      }
      return Promise.resolve(anchor(blob, name));
    }
  };
  function anchor(blob, name) {
    var u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = u; a.download = name; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 30000);
  }

  /* ---------------------------------------------------------------- IA : API Anthropic */
  var getKey = function () { try { return localStorage.getItem(KEY_LS) || ""; } catch (e) { return ""; } };
  web.hasKey = function () { return !!getKey(); };
  web.keyHint = function () { var k = getKey(); return k ? k.slice(0, 10) + "…" + k.slice(-4) : ""; };
  web.setKey = function (k) { localStorage.setItem(KEY_LS, k); };
  web.clearKey = function () { try { localStorage.removeItem(KEY_LS); } catch (e) {} };

  function toB64(blob) { return new Promise(function (ok, ko) { var r = new FileReader(); r.onload = function () { ok(String(r.result).split(",")[1]); }; r.onerror = function () { ko(r.error); }; r.readAsDataURL(blob); }); }
  function prepImage(b) {
    var okTypes = ["image/jpeg", "image/png", "image/webp", "image/gif"];
    return createImageBitmap(b).then(function (bmp) {
      var max = 1568, sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
      if (sc === 1 && b.size < 3.5e6 && okTypes.indexOf(b.type) >= 0) return { type: b.type, blob: b };
      var c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
      c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      return new Promise(function (ok) { c.toBlob(function (o) { ok({ type: "image/jpeg", blob: o }); }, "image/jpeg", 0.85); });
    }).catch(function () { throw { code: "image_rejected", message: "Photo illisible." }; })
      .then(function (r) { return toB64(r.blob).then(function (d) { return { type: "image", source: { type: "base64", media_type: r.type, data: d } }; }); });
  }
  function errFor(status, j) {
    var m = (j && j.error && j.error.message) || "";
    if (status === 401 || status === 403) return { code: "not_granted", message: "Clé d'API refusée. Vérifiez-la dans Carnet → Données." };
    if (status === 429) return { code: "rate_limited", message: "Trop d'appels ou crédit insuffisant. Réessayez plus tard." };
    if (status === 413) return { code: "prompt_too_large", message: "Demande trop longue." };
    if (status === 400 && /credit|balance/i.test(m)) return { code: "rate_limited", message: "Crédit API insuffisant. Ajoutez du crédit sur console.anthropic.com." };
    if (status === 400 && /image/i.test(m)) return { code: "image_rejected", message: "Cette photo n'a pas pu être lue." };
    if (status === 529 || status >= 500) return { code: "upstream_error", message: "Le service d'IA est surchargé. Réessayez dans un instant." };
    return { code: "upstream_error", message: m ? "Erreur de l'IA : " + m : "Erreur de l'IA (" + status + ")." };
  }
  function parseJsonLoose(t) {
    var s = String(t || "").trim();
    try { return { ok: true, v: JSON.parse(s) }; } catch (e) {}
    var m = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
    if (m) { try { return { ok: true, v: JSON.parse(m[1].trim()) }; } catch (e) {} }
    var a = s.search(/[\[{]/), b = Math.max(s.lastIndexOf("}"), s.lastIndexOf("]"));
    if (a >= 0 && b > a) { try { return { ok: true, v: JSON.parse(s.slice(a, b + 1)) }; } catch (e) {} }
    return { ok: false };
  }
  function call(input, opts, asJson) {
    opts = opts || {};
    var key = getKey();
    if (!key) return Promise.reject({ code: "not_granted", message: "Aucune clé d'API enregistrée." });
    if (opts.signal && opts.signal.aborted) return Promise.reject({ code: "cancelled", message: "Annulé." });
    var turns = typeof input === "string" ? [{ role: "user", content: input }] : (Array.isArray(input) ? input.map(function (t) { return { role: t.role, content: String(t.content) }; }) : null);
    if (!turns || !turns.length || turns[turns.length - 1].role !== "user") return Promise.reject({ code: "invalid_request", message: "Demande invalide." });
    if (asJson) turns[turns.length - 1].content += "\n\nRéponds uniquement par la valeur JSON demandée, sans texte avant ni après et sans bloc de code.";
    var imgs = opts.images ? (opts.images instanceof Blob ? [opts.images] : Array.from(opts.images)) : [];
    var text = "", sent = 0, lastPush = 0, stop = null, pushT = 0;
    function push(final) {
      if (!opts.onText || text.length === sent || !text.trim()) return;
      var now = Date.now();
      if (!final && now - lastPush < 90) { clearTimeout(pushT); pushT = setTimeout(function () { push(false); }, 90); return; }
      clearTimeout(pushT); lastPush = now;
      var delta = text.slice(sent); sent = text.length;
      try { opts.onText({ text: text, delta: delta }); } catch (e) { console.error(e); }
    }
    return Promise.all(imgs.slice(0, 5).map(prepImage)).then(function (blocks) {
      var last = turns[turns.length - 1];
      if (blocks.length) last.content = blocks.concat([{ type: "text", text: last.content }]);
      return fetch(API, {
        method: "POST", signal: opts.signal,
        headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: MODELS[opts.modelTier] || MODELS["default"], max_tokens: 2048, stream: true, messages: turns })
      });
    }).then(function (resp) {
      if (!resp.ok) return resp.json().catch(function () { return null; }).then(function (j) { throw errFor(resp.status, j); });
      var reader = resp.body.getReader(), dec = new TextDecoder(), buf = "";
      function handle(block) {
        var data = block.split("\n").filter(function (l) { return l.indexOf("data:") === 0; }).map(function (l) { return l.slice(5).trim(); }).join("");
        if (!data) return;
        var ev; try { ev = JSON.parse(data); } catch (e) { return; }
        if (ev.type === "content_block_delta" && ev.delta && ev.delta.type === "text_delta") { text += ev.delta.text; push(false); }
        else if (ev.type === "message_delta" && ev.delta && ev.delta.stop_reason) stop = ev.delta.stop_reason;
        else if (ev.type === "error") throw errFor(ev.error && ev.error.type === "overloaded_error" ? 529 : 500, ev);
      }
      function pump() {
        return reader.read().then(function (r) {
          if (r.done) { if (buf.trim()) handle(buf); return; }
          buf += dec.decode(r.value, { stream: true }).replace(/\r\n/g, "\n");
          var i; while ((i = buf.indexOf("\n\n")) >= 0) { var b = buf.slice(0, i); buf = buf.slice(i + 2); handle(b); }
          return pump();
        });
      }
      return pump();
    }).then(function () {
      if (stop === "refusal") throw { code: "refused", message: "L'IA a refusé de répondre à cette demande." };
      if (!text.trim()) throw { code: "empty_completion", message: "L'IA n'a rien répondu. Réessayez." };
      push(true);
      var truncated = stop === "max_tokens";
      if (asJson) {
        var p = parseJsonLoose(text);
        if (!p.ok || truncated) throw { code: "invalid_json", message: "Réponse inexploitable.", text: text };
        return p.v;
      }
      return { text: text, truncated: truncated, modelTierApplied: opts.modelTier || "default" };
    }).catch(function (e) {
      clearTimeout(pushT);
      if (e && e.name === "AbortError") throw { code: "cancelled", message: "Analyse arrêtée.", text: text || undefined };
      if (e && e.code) { if (text && e.text === undefined && e.code !== "refused") e.text = text; throw e; }
      throw { code: "upstream_error", message: "Connexion à l'IA impossible. Vérifiez votre réseau.", text: text || undefined };
    });
  }
  function makeSample() {
    if (!getKey()) return null;
    var f = function (input, opts) { return call(input, opts, false); };
    f.json = function (input, opts) { return call(input, opts, true); };
    f.limits = function () { return Promise.resolve({ maxPromptBytes: 262144, images: { maxCount: 5, maxInputBytes: 20e6, mediaTypes: ["image/jpeg", "image/png", "image/webp", "image/gif"] } }); };
    return f;
  }

  /* ---------------------------------------------------------------- point d'entrée */
  window.claude = {
    use: function (n) {
      return web.ready.then(function () {
        if (n === "db") return db;
        if (n === "user") return user;
        if (n === "assets") return assets;
        if (n === "downloads") return downloads;
        if (n === "sample") return makeSample();
        return null;
      });
    }
  };
})();

</script>

<body>
<title>Carnet NTMF 42</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Concept : l'écran de fin de partie d'un jeu de trail. Rose fluo sur nuit violette, viseur braqué sur la
   ligne d'arrivée, niveaux d'XP et fil d'actu. Humour pop, mais les chiffres restent sérieux. */
:root {
  --bg: #FFF1F7; --surface: #FFFFFF; --surface2: #FFE9F3; --ink: #1B1030; --mute: #6B5C80; --line: #EBC7DB;
  --accent: #E0006F; --accent-ink: #FFFFFF; --accent-text: #C1005E; --tint: #FFDCEC;
  --forest: #5E8A00; --moss: #7FAE0B; --sky: #4C6FFF;
  --ok: #0E8F63; --warn: #B86E00; --bad: #D0243B;
  --hero-a: #2E1045; --hero-b: #12081F; --hero-ink: #FFF3FA; --hero-mute: #C5B0DD; --hero-line: rgba(255, 64, 160, .26);
  --bar: #F2D4E4; --shadow: 0 2px 0 rgba(27, 16, 48, .05); --on-bar: #14081C; --lime: #C6FF3D;
  --z1: #8A7FA3; --z2: #0FBF84; --z3: #E8A800; --z4: #E0006F; --z5: #7B2CBF;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-hud: "Chakra Petch", "Bahnschrift", "Arial Narrow", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0A17; --surface: #181127; --surface2: #20173A; --ink: #F6EEFA; --mute: #A596BD; --line: #352A50;
    --accent: #FF2E93; --accent-ink: #14081C; --accent-text: #FF6DB4; --tint: #3B1233;
    --forest: #C6FF3D; --moss: #9BE02A; --sky: #7C9BFF;
    --ok: #3DE8A6; --warn: #FFB020; --bad: #FF6B7A;
    --bar: #2A2044; --shadow: none;
    --z1: #8C80AA; --z2: #3DE8A6; --z3: #FFD23F; --z4: #FF2E93; --z5: #B36BFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0A17; --surface: #181127; --surface2: #20173A; --ink: #F6EEFA; --mute: #A596BD; --line: #352A50;
  --accent: #FF2E93; --accent-ink: #14081C; --accent-text: #FF6DB4; --tint: #3B1233;
  --forest: #C6FF3D; --moss: #9BE02A; --sky: #7C9BFF;
  --ok: #3DE8A6; --warn: #FFB020; --bad: #FF6B7A;
  --bar: #2A2044; --shadow: none;
  --z1: #8C80AA; --z2: #3DE8A6; --z3: #FFD23F; --z4: #FF2E93; --z5: #B36BFF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 800; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1; text-transform: uppercase; }
h2 { font-size: 34px; }
h3 { font-size: 25px; }
h4 { font-size: 19px; }
p { margin: 0; }
.mono { font-family: var(--f-hud); font-variant-numeric: tabular-nums; }
.mute { color: var(--mute); }
.small { font-size: 14px; }
.label { font-family: var(--f-hud); font-size: 13px; letter-spacing: .03em; color: var(--mute); font-weight: 500; }
.acc { color: var(--accent-text); }
a { color: var(--accent-text); }

/* barre du haut et navigation */
.bar-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px 12px; }
.brand { min-width: 0; display: flex; align-items: center; gap: 9px; font-family: var(--f-display); font-weight: 900; text-transform: uppercase; letter-spacing: .04em; font-size: 22px; white-space: nowrap; }
.brand svg { width: 28px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; flex: none; }
.brand b { color: var(--accent-text); font-weight: 900; }
.brand span { overflow: hidden; text-overflow: ellipsis; }
.brand .cn { font-style: normal; }
@media (max-width: 440px) { .brand .cn { display: none; } }
@media (max-width: 440px) { .brand { font-size: 19px; gap: 6px; } .brand svg { width: 24px; height: 24px; } .lvl { min-width: 56px; } .bar-top { gap: 8px; } }
.top-r { flex: none; display: flex; align-items: center; gap: 10px; min-width: 0; }
.lvl { font-family: var(--f-hud); font-weight: 600; font-size: 13px; display: flex; flex-direction: column; gap: 4px; min-width: 76px; }
.lvl .xpb { height: 5px; background: var(--bar); border-radius: 3px; overflow: hidden; }
.lvl .xpb i { display: block; height: 100%; background: var(--accent); }
.lvl .rk { display: none; }
@media (min-width: 600px) { .lvl .rk { display: inline; } .lvl { min-width: 150px; } }
.icon-btn { appearance: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); width: 38px; height: 38px; border-radius: 10px; cursor: pointer; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; background: var(--surface); border-top: 1.5px solid var(--line); padding: 0 6px calc(6px + env(safe-area-inset-bottom, 0px)); }
.nav .tab { position: relative; flex: 1 1 0; min-width: 0; appearance: none; border: 0; background: none; color: var(--mute); display: flex; flex-direction: column; align-items: center; gap: 3px; font: 700 11.5px var(--f-body); padding: 9px 2px 5px; cursor: pointer; }
.nav .tab svg { width: 23px; height: 23px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.nav .tab[aria-selected="true"] { color: var(--accent-text); }
.nav .tab[aria-selected="true"]::before { content: ""; position: absolute; top: -1.5px; left: 22%; right: 22%; height: 3.5px; background: var(--accent); border-radius: 0 0 3px 3px; }
@media (min-width: 900px) {
  .nav { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; border: 1.5px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 18px; }
  .nav .tab { flex-direction: row; justify-content: center; gap: 8px; font-size: 15px; padding: 10px 8px; border-radius: 8px; }
  .nav .tab[aria-selected="true"] { background: var(--tint); }
  .nav .tab[aria-selected="true"]::before { display: none; }
  .wrap { padding-block-end: 56px; }
}
.tab:focus-visible, .btn:focus-visible, .pill:focus-visible, .row-btn:focus-visible, .icon-btn:focus-visible, .hm-c:focus-visible, .chk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* héros : l'écran-titre */
.hero { position: relative; overflow: hidden; border-radius: 12px; background: linear-gradient(160deg, var(--hero-a), var(--hero-b)); color: var(--hero-ink); padding: 18px 20px 0; border: 1.5px solid rgba(255, 64, 160, .45); }
.hero .contours { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero .contours path { fill: none; stroke: var(--hero-line); stroke-width: 1; }
.hero .contours path.ix { stroke-width: 1.9; }
.hero-in { position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.hero .label { color: var(--hero-mute); }
.hud { position: relative; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; font-family: var(--f-hud); font-weight: 600; font-size: 14px; }
.hud .chip { background: var(--accent); color: #14081C; padding: 3px 12px 3px 9px; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); letter-spacing: .02em; }
.hud .xpb { flex: 1 1 120px; max-width: 260px; height: 8px; background: rgba(255, 255, 255, .14); border-radius: 2px; overflow: hidden; }
.hud .xpb i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), #FF9AD0); }
.hud .xpt { color: var(--hero-mute); font-weight: 500; font-size: 13px; }
.count { font-family: var(--f-display); font-weight: 900; font-size: clamp(88px, 22vw, 168px); line-height: .8; letter-spacing: -.005em; text-transform: uppercase; transform: skewX(-7deg); transform-origin: left bottom; padding-top: 4px; }
.count .j { color: #FF2E93; }
.hero-sub { margin-top: 12px; color: var(--hero-ink); font-size: 17px; max-width: 34ch; }
.hero-stats { display: flex; gap: 22px; flex-wrap: wrap; }
.hero-stats .v { font-family: var(--f-display); font-weight: 800; font-size: 36px; line-height: 1; }
.hero-stats .v small { font-size: 16px; color: var(--hero-mute); margin-left: 3px; font-weight: 700; }
.hero-stats .k { font-family: var(--f-hud); font-size: 13px; color: var(--hero-mute); margin-top: 4px; }
.ridge-wrap { position: relative; margin: 14px -20px 0; }
.ridge { display: block; width: 100%; height: auto; }
.ridge .r-base { fill: rgba(255, 243, 250, .09); stroke: rgba(255, 243, 250, .5); stroke-width: 1.5; stroke-linejoin: round; }
.ridge .r-done { fill: #FF2E93; fill-opacity: .88; stroke: #FFA3D5; stroke-width: 1.8; stroke-linejoin: round; }
.ridge .r-sep { stroke: rgba(255, 243, 250, .28); stroke-dasharray: 3 4; }
.ridge .r-dot { fill: #fff; stroke: #FF2E93; stroke-width: 3; }
.ridge .r-flag { stroke: #FFF3FA; stroke-width: 2; }
.ridge .r-flag-f { fill: #C6FF3D; }
.ridge .r-xh { fill: none; stroke: #C6FF3D; stroke-width: 1.8; }
.ridge-leg { position: relative; display: flex; padding: 0 20px 10px; margin-inline: -20px; margin-top: -2px; font-family: var(--f-hud); font-weight: 500; font-size: 12px; color: var(--hero-mute); }
.ridge-leg span { text-align: center; white-space: nowrap; overflow: hidden; }
.pulse { animation: pu 1.8s ease-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes pu { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

/* blocs */
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 760px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr); } h2 { font-size: 30px; } }
.card { position: relative; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; box-shadow: var(--shadow); }
.card.plain { border-style: dashed; background: transparent; box-shadow: none; }
.card.hl::before, .card.hl::after { content: ""; position: absolute; width: 18px; height: 18px; border: 3.5px solid var(--accent); pointer-events: none; }
.card.hl::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
.card.hl::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 14px; }
.stat .v { white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: 40px; line-height: 1; }
.stat .v small { font-size: 17px; font-weight: 700; color: var(--mute); margin-left: 3px; }
.stat .k { font-family: var(--f-hud); font-size: 13px; color: var(--mute); margin-top: 5px; line-height: 1.25; }
.pill { appearance: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 13px; font: 700 14px var(--f-body); cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tag { display: inline-block; font-family: var(--f-hud); font-weight: 600; font-size: 13px; padding: 2px 10px; border-radius: 4px; background: var(--tint); color: var(--accent-text); }
.tag.ok { background: transparent; border: 1.5px solid var(--ok); color: var(--ok); }
.tag.warn { background: transparent; border: 1.5px solid var(--warn); color: var(--warn); }
.tag.bad { background: transparent; border: 1.5px solid var(--bad); color: var(--bad); }
.sub { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.sub::-webkit-scrollbar { display: none; }
.sub .pill { flex: 0 0 auto; }

/* boutons et champs */
.btn { appearance: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 700 15px var(--f-body); padding: 9px 16px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); border-radius: 0; clip-path: polygon(0 0, calc(100% - 11px) 0, 100% 11px, 100% 100%, 11px 100%, 0 calc(100% - 11px)); padding-inline: 20px; }
.btn.primary:focus-visible { outline-offset: -5px; }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.sm { padding: 5px 11px; font-size: 14px; }
.btn.primary.sm { padding-inline: 16px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-family: var(--f-hud); font-size: 13px; color: var(--mute); font-weight: 500; letter-spacing: .02em; }
input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="time"], select, textarea {
  font: 400 16px var(--f-body); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 66px; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg .pill { min-width: 44px; text-align: center; }

/* listes */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 62px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1.5px solid var(--line); }
.row:first-child { border-top: 0; }
.row .d { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.05; text-transform: uppercase; }
.row .d span { display: block; font-family: var(--f-hud); font-weight: 500; font-size: 12.5px; color: var(--mute); text-transform: none; }
.row.today { background: var(--tint); margin-inline: -18px; padding-inline: 18px; }
.row-btn { appearance: none; border: 2px solid var(--line); background: var(--surface); color: var(--mute); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 17px; line-height: 1; }
.row-btn[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--accent-ink); }
.checks { display: flex; flex-direction: column; }
.chk { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; appearance: none; border: 0; border-top: 1.5px solid var(--line); background: none; color: var(--ink); font: 400 15px/1.4 var(--f-body); padding: 11px 0; cursor: pointer; width: 100%; }
.chk:first-child { border-top: 0; }
.chk i { width: 22px; height: 22px; border: 2px solid var(--mute); border-radius: 5px; display: grid; place-items: center; font-style: normal; font-size: 14px; color: transparent; margin-top: 1px; }
.chk[aria-pressed="true"] i { background: var(--ok); border-color: var(--ok); color: var(--accent-ink); }
.chk[aria-pressed="true"] span { color: var(--mute); text-decoration: line-through; }
.weeks { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.weeks .pill { flex: 0 0 auto; min-width: 42px; text-align: center; font-family: var(--f-hud); font-weight: 600; padding-inline: 8px; }
.pill.cur { border-color: var(--accent); }
.bar { height: 9px; background: var(--bar); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.over > i { background: var(--warn); }
.bar.green > i { background: var(--forest); }
.macro { display: grid; grid-template-columns: 82px minmax(0, 1fr) 128px; gap: 10px; align-items: center; font-size: 14px; font-weight: 500; }
.macro + .macro { margin-top: 9px; }
.macro .r { text-align: right; font-family: var(--f-hud); font-weight: 500; font-size: 13px; }

/* graphiques */
.chart-wrap { overflow-x: auto; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-hud); font-size: 12px; fill: var(--mute); }
.chart .ax { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linejoin: round; }
.chart .ar { fill: url(#eg); }
.chart .pl { fill: var(--bar); }
.chart .dn { fill: var(--forest); }
.chart .hl { fill: var(--accent); }
.chart .tg { stroke: var(--warn); stroke-dasharray: 4 4; stroke-width: 1.3; }
.chart .xh { fill: none; stroke: var(--on-bar); stroke-width: 2; }
.zbar { display: flex; height: 16px; border-radius: 3px; overflow: hidden; background: var(--bar); }
.zbar i { display: block; height: 100%; }
.zleg { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; }
.zleg span { display: inline-flex; align-items: center; gap: 6px; }
.zleg b { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.replay { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin-top: 12px; }
.replay > div { border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 14px; line-height: 1.3; }
.replay b { display: block; font-family: var(--f-hud); font-weight: 600; font-size: 13px; margin-bottom: 3px; }
.replay .w b { color: var(--accent-text); }
.replay .b b { color: var(--ok); }

/* calendrier de chaleur */
.hm { display: grid; grid-template-columns: 14px repeat(25, minmax(0, 1fr)); gap: 3px; align-items: center; }
.hm-h, .hm-l { font-family: var(--f-hud); font-size: 10.5px; color: var(--mute); text-align: center; }
.hm-h { height: 14px; overflow: visible; white-space: nowrap; }
.hm-c { appearance: none; border: 0; padding: 0; width: 100%; aspect-ratio: 1; border-radius: 2px; background: var(--bar); cursor: pointer; }
.hm-c.rest { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.hm-c.fut { background: var(--sky); opacity: calc(.16 + var(--l) * .14); }
.hm-c.done { background: var(--accent); opacity: calc(.5 + var(--l) * .125); }
.hm-c.miss { background: transparent; box-shadow: inset 0 0 0 1.6px var(--bad); }
.hm-c.race { background: var(--forest); opacity: 1; box-shadow: 0 0 0 2px var(--ink); }
.hm-c.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.hm-leg { display: flex; gap: 6px 14px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--mute); }
.hm-leg span { display: inline-flex; align-items: center; gap: 6px; }
.hm-leg i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }

/* fil d'actu */
.feed { display: flex; flex-direction: column; }
.fd { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1.5px solid var(--line); font-size: 15px; }
.fd:first-child { border-top: 0; }
.fd-d { font-family: var(--f-hud); font-size: 13px; color: var(--mute); }
.fd-x { font-family: var(--f-hud); font-weight: 600; font-size: 13px; color: var(--accent-text); white-space: nowrap; }

/* trophées */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.badge .hex { width: 74px; height: 82px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--bar); display: grid; place-items: center; font-family: var(--f-display); font-weight: 900; font-size: 27px; color: var(--mute); }
.badge.on .hex { background: linear-gradient(160deg, #FF9AD0, #FF2E93 55%, #8F0F5C); color: #fff; }
.badge .t { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: 20px; line-height: 1; }
.badge .dd { font-size: 13px; color: var(--mute); line-height: 1.3; }
.badge:not(.on) { border-style: dashed; }
.badge .bar { width: 100%; height: 6px; }

/* altimètre */
.alt { position: relative; height: 16px; background: var(--bar); border-radius: 3px; margin: 14px 0 6px; }
.alt > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--sky), var(--accent)); border-radius: 3px; }
.alt > b { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--ink); opacity: .55; }
.peaks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.peak { font-size: 13px; padding: 4px 10px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); }
.peak.on { background: var(--tint); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }

/* score en anneau */
.ring { --p: 0; width: 92px; height: 92px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--bar) 0); display: grid; place-items: center; flex: none; }
.ring > div { width: 72px; height: 72px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; font-family: var(--f-display); font-weight: 900; font-size: 32px; line-height: 1; }
.ring small { display: block; font-family: var(--f-hud); font-size: 12px; font-weight: 500; color: var(--mute); margin-top: 2px; }
.two { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.lst { margin: 6px 0 0; padding-left: 20px; }
.lst li + li { margin-top: 4px; }

/* tableaux et divers */
.tbl-wrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 15px; }
table.t th { font-family: var(--f-hud); font-weight: 500; font-size: 13px; color: var(--mute); text-align: left; padding: 6px 12px 6px 0; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
table.t td { padding: 9px 12px 9px 0; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
.big { font-family: var(--f-display); font-weight: 900; font-size: 48px; line-height: 1; }
.analysis p + p { margin-top: 10px; }
.analysis ul { margin: 6px 0 0; padding-left: 20px; }
.analysis strong { font-family: var(--f-hud); font-weight: 600; color: var(--accent-text); }
.callout { border-left: 4px solid var(--ok); background: var(--surface2); padding: 10px 14px; border-radius: 0 8px 8px 0; }
.callout.warn { border-left-color: var(--warn); }
.callout.bad { border-left-color: var(--bad); }
.drop { border: 2px dashed var(--line); border-radius: 10px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; background: var(--surface2); }
.drop.over { border-color: var(--accent); background: var(--tint); }
.photo { width: 76px; height: 76px; object-fit: cover; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); }
.meal { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; padding: 13px 0; border-top: 1.5px solid var(--line); }
.meal:first-child { border-top: 0; }
.meal .nums { display: flex; gap: 12px; flex-wrap: wrap; font-family: var(--f-hud); font-weight: 500; font-size: 13px; color: var(--mute); margin-top: 4px; }
.preview-img { max-width: 100%; max-height: 260px; border-radius: 8px; border: 1.5px solid var(--line); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 8px; font-size: 15px; font-weight: 500; max-width: calc(100% - 32px); z-index: 20; }
@media (min-width: 900px) { .toast { bottom: calc(24px + env(safe-area-inset-bottom, 0px)); } }

}

function slopeHtml() {
  const flat = parseMMSS(S.calc.flat), s = num(S.calc.slope);
  if (flat == null) return `<p class="small" style="color:var(--bad)">Allure au format 5:55.</p>`;
  const one = s != null ? (() => { const p = flat * slopeFactor(s / 100); return `<div class="stats" style="margin-bottom:14px"><div class="stat"><div class="v">${fmtPace(p)}<small>/km</small></div><div class="k">À effort égal sur ${String(s).replace(".", ",")} %</div></div><div class="stat"><div class="v">${(3600 / p).toFixed(1).replace(".", ",")}<small>km/h</small></div><div class="k">Vitesse</div></div>${s > 0 ? `<div class="stat"><div class="v">${fmtNum(s * 10 / p * 3600)}<small>m/h</small></div><div class="k">Montée par heure</div></div>` : ""}</div>`; })() : "";
  const sl = [-10, -5, 0, 3, 5, 8, 10, 12, 15, 20];
  const tip = g => g >= 15 ? "Marche active" : g >= 10 ? "Marche rapide" : g >= 6 ? "Trot court" : g > 0 ? "En contrôle" : g < 0 ? "Relâchez" : "Plat";
  return `${one}<div class="tbl-wrap"><table class="t"><tr><th>Pente</th><th>Allure équivalente</th><th>Conseil</th></tr>${sl.map(g => `<tr><td class="mono">${g > 0 ? "+" : ""}${g} %</td><td class="mono">${fmtPace(flat * slopeFactor(g / 100))}/km</td><td class="mute" style="white-space:normal">${tip(g)}</td></tr>`).join("")}</table></div>

function loadStats() {

  const eff = S.sessions.filter(s => s.avgHr && s.paceSec && s.km >= 5).sort((a, b) => a.date < b.date ? -1 : 1).map(s => ({ d: s.date, v: 3600 / s.paceSec / s.avgHr * 100 }));
  let effDelta = null; if (eff.length >= 3) { const last = eff[eff.length - 1].v, prev = eff.slice(Math.max(0, eff.length - 4), eff.length - 1), pm = prev.reduce((a, b) => a + b.v, 0) / prev.length; effDelta = (last / pm - 1) * 100; }

async function analyzeSession(id, mode) {

    : `Tu es entraîneur de trail running. ${addr()} Réponds en français, de façon directe et concrète, 230 mots au maximum, en 4 courts paragraphes introduits par un mot en gras : **Verdict**, **Allures et effort**, **À surveiller**, **Prochaine séance**. Pas d'autre titre, pas de tableau. Compare la séance réalisée à la séance prévue (régularité, dérive d'allure ou de FC, respect des zones). Ne commente pas la FC si elle manque. Ne propose pas de modifier le programme sauf si les chiffres l'imposent.`;

async function restoreBackup(file) {

    if (j.profile && typeof j.profile === "object" && !Array.isArray(j.profile)) { S.profile = Object.assign({}, S.profile, j.profile); applyProfile(); await S.base.set(S.profile); }
    toast(n + " élément" + (n > 1 ? "s" : "") + " restauré" + (n > 1 ? "s" : "") + ".");
  } catch (e) { toast("Restauration impossible : " + errText(e)); }

}

  if (db && id) {
    S.base = db.doc("data/users/" + id + "/profile");
    const err = e => { toast("Lecture des données : " + errText(e)); };
    S.base.onSnapshot(snap => { S.profile = snap.exists ? (snap.data() || {}) : {}; applyProfile(); later(); }, err);
    S.base.collection("sessions").onSnapshot(q => { S.sessions = q.docs.map(d => Object.assign({ id: d.id }, d.data())); later(); }, err);
    S.base.collection("meals").onSnapshot(q => { S.meals = q.docs.map(d => Object.assign({ id: d.id }, d.data())); later(); }, err);
    S.base.collection("days").onSnapshot(q => { S.days = q.docs.map(d => Object.assign({ id: d.id }, d.data())); later(); }, err);
    S.base.collection("measures").onSnapshot(q => { S.measures = q.docs.map(d => Object.assign({ id: d.id }, d.data())); later(); }, err);
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  S.ready = true;
  render();
}
init();
})();
</script>

<script>if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });</script>
